<!DOCTYPE html>
<html>

<head>
    <title>Cursor GLB to Image Renderer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: monospace;
        }

        canvas {
            border: 2px solid #00f2ea;
            display: block;
            margin: 20px auto;
        }

        #instructions {
            text-align: center;
            margin: 20px;
        }

        button {
            background: #00f2ea;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>

<body>
    <div id="instructions">
        <h1>Cursor GLB Renderer</h1>
        <p>This will render your cursor.glb to an image you can use as a cursor.</p>
        <div id="status">Loading...</div>
        <button id="download" style="display:none;">Download Cursor Image</button>
    </div>
    <canvas id="canvas" width="64" height="64"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('download');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            alpha: true,
            antialias: true,
            preserveDrawingBuffer: true
        });
        renderer.setSize(64, 64);
        renderer.setClearColor(0x000000, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();

        status.textContent = 'Loading cursor.glb...';

        loader.load(
            'assets/models/cursor.glb',
            function (gltf) {
                status.textContent = 'Model loaded! Rendering...';

                const model = gltf.scene;

                // Center and scale the model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;
                model.scale.multiplyScalar(scale);

                model.position.sub(center.multiplyScalar(scale));

                scene.add(model);

                // Render
                renderer.render(scene, camera);

                status.textContent = 'Rendered! Right-click the image above to save it.';
                downloadBtn.style.display = 'inline-block';

                downloadBtn.onclick = function () {
                    const link = document.createElement('a');
                    link.download = 'cursor_rendered.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
            },
            function (xhr) {
                status.textContent = `Loading... ${Math.round(xhr.loaded / xhr.total * 100)}%`;
            },
            function (error) {
                status.textContent = 'ERROR: ' + error.message;
                status.style.color = '#ff0000';
                console.error(error);
            }
        );
    </script>
</body>

</html>
