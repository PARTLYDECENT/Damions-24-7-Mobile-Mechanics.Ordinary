<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hantu Raya SDF Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #fff; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; color: #00ffcc; text-transform: uppercase; }
        p { margin: 5px 0 0 0; font-size: 0.9rem; color: #aaa; }
        #controls-help { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #666; pointer-events: none; font-size: 0.8rem; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(0, 255, 204, 0.8); transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 10; box-shadow: 0 0 5px rgba(0,255,204,0.5); }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <h1>Hantu Raya Model 1</h1>
        <p>SDF Raymarching Engine // Pure Math Architecture</p>
    </div>
    <div id="controls-help">W, A, S, D: Walk | CLICK & DRAG: Look Around | You are in the room.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec2 u_resolution;
        uniform vec3 u_camPos;
        uniform vec3 u_camTarget;
        uniform float u_time;

        // Constant settings
        const int MAX_STEPS = 150;
        const float MAX_DIST = 40.0;
        const float SURF_DIST = 0.002;

        // SDF Rotation Helper
        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        // --- SDF Primitives ---
        float sdBox(vec3 p, vec3 b) {
            vec3 q = abs(p) - b;
            return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
        }

        float sdCylinder(vec3 p, float h, float r) {
            vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h);
            return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
        }

        float sdTorus(vec3 p, vec2 t) {
            vec2 q = vec2(length(p.xz)-t.x, p.y);
            return length(q)-t.y;
        }

        // Union with Material ID
        vec2 opU(vec2 d1, vec2 d2) {
            return (d1.x < d2.x) ? d1 : d2;
        }

        // --- SCENE MAPPING ---
        vec2 map(vec3 pos) {
            vec2 res = vec2(MAX_DIST, 0.0);

            // 1. Shop Floor & Garage Walls (ID: 0)
            float dFloor = pos.y + 0.35;
            float dWalls = -sdBox(pos - vec3(0.0, 4.0, 0.0), vec3(12.0, 5.0, 12.0)); // The concrete room
            res = opU(res, vec2(min(dFloor, dWalls), 0.0));

            // Overhead Neon Lights (ID: 5)
            vec3 pLight = pos;
            pLight.x = abs(pLight.x) - 4.0;
            float dLights = sdBox(pLight - vec3(0.0, 8.9, 0.0), vec3(0.1, 0.1, 8.0));
            res = opU(res, vec2(dLights, 5.0));

            // Mirror the X axis to perfectly build the left/right frame symmetrically
            vec3 p = pos;
            p.x = abs(p.x);

            // 2. UNISTRUT / REINFORCED LADDER FRAME (ID: 1)
            float dFrame = MAX_DIST;
            
            // Main lower ladder rail
            vec3 pRail = p - vec3(0.4, 0.0, -0.2);
            dFrame = min(dFrame, sdBox(pRail, vec3(0.04, 0.06, 2.0)));
            
            // Secondary upper sill rail (for strength)
            vec3 pSill = p - vec3(0.4, 0.2, 0.0);
            dFrame = min(dFrame, sdBox(pSill, vec3(0.04, 0.04, 1.2)));

            // Ladder Cross Members (spanning center)
            dFrame = min(dFrame, sdBox(p - vec3(0.0, 0.0, 1.7), vec3(0.44, 0.06, 0.04))); // Front Bumper
            dFrame = min(dFrame, sdBox(p - vec3(0.0, 0.0, 0.6), vec3(0.44, 0.06, 0.04))); // Firewall Base
            dFrame = min(dFrame, sdBox(p - vec3(0.0, 0.0, -0.5), vec3(0.44, 0.06, 0.04))); // Main Hoop Base
            dFrame = min(dFrame, sdBox(p - vec3(0.0, 0.0, -2.1), vec3(0.44, 0.06, 0.04))); // Rear Tail

            // Front Uprights
            dFrame = min(dFrame, sdBox(p - vec3(0.4, 0.25, 1.7), vec3(0.04, 0.25, 0.04)));
            
            // A-Pillars (Angled back)
            vec3 pAPillar = p - vec3(0.4, 0.8, 0.4);
            pAPillar.yz *= rot(0.45);
            dFrame = min(dFrame, sdBox(pAPillar, vec3(0.04, 0.6, 0.04)));

            // B-Pillars (Main Hoop)
            vec3 pBPillar = p - vec3(0.4, 0.8, -0.5);
            pBPillar.yz *= rot(-0.05);
            dFrame = min(dFrame, sdBox(pBPillar, vec3(0.04, 0.8, 0.04)));

            // Roof Rails
            vec3 pRoof = p - vec3(0.4, 1.45, -0.15);
            pRoof.yz *= rot(0.05);
            dFrame = min(dFrame, sdBox(pRoof, vec3(0.04, 0.04, 0.45)));
            
            // Roof Crosses
            dFrame = min(dFrame, sdBox(p - vec3(0.0, 1.43, 0.25), vec3(0.44, 0.04, 0.04)));
            dFrame = min(dFrame, sdBox(p - vec3(0.0, 1.5, -0.55), vec3(0.44, 0.04, 0.04)));

            // Front Hood Upper Rails (Angled down)
            vec3 pHoodRail = p - vec3(0.4, 0.55, 1.15);
            pHoodRail.yz *= rot(-0.1);
            dFrame = min(dFrame, sdBox(pHoodRail, vec3(0.04, 0.04, 0.6)));

            // Rear Motor Cradle Rails
            dFrame = min(dFrame, sdBox(p - vec3(0.4, 0.2, -1.3), vec3(0.04, 0.04, 0.8)));

            // Front Suspension Structure (A-Arms & Coilovers)
            vec3 pLCA = p - vec3(0.65, -0.1, 1.6);
            pLCA.xy *= rot(0.2);
            dFrame = min(dFrame, sdCylinder(pLCA, 0.25, 0.02)); // Lower
            
            vec3 pUCA = p - vec3(0.65, 0.15, 1.6);
            pUCA.xy *= rot(-0.2);
            dFrame = min(dFrame, sdCylinder(pUCA, 0.25, 0.02)); // Upper

            vec3 pShock = p - vec3(0.7, 0.15, 1.6);
            pShock.xy *= rot(0.3);
            dFrame = min(dFrame, sdCylinder(pShock, 0.35, 0.04)); // Coilover body

            res = opU(res, vec2(dFrame, 1.0)); // ID 1 = Strut Frame

            // 3. SHEET METAL PANELS (ID: 2)
            float dPanels = MAX_DIST;
            
            // Main Hood Flat Panel (Chamfered)
            vec3 pHood = p - vec3(0.0, 0.72, 1.2);
            pHood.yz *= rot(-0.1);
            float hoodPlane = sdBox(pHood, vec3(0.4, 0.01, 0.5));
            float chamfer = dot(pHood - vec3(0.25, 0.0, 0.3), normalize(vec3(1.0, 0.0, 1.0))); // Cut corners
            dPanels = min(dPanels, max(hoodPlane, chamfer));

            // Hood Side Kick Panels
            vec3 pKick = p - vec3(0.4, 0.35, 1.2);
            dPanels = min(dPanels, sdBox(pKick, vec3(0.01, 0.2, 0.5)));

            // Firewall
            dPanels = min(dPanels, sdBox(p - vec3(0.0, 0.35, 0.65), vec3(0.4, 0.3, 0.01)));

            // Metal Bucket Seat
            dPanels = min(dPanels, sdBox(p - vec3(0.0, 0.1, -0.1), vec3(0.25, 0.02, 0.25))); // Base
            vec3 pSeatBack = p - vec3(0.0, 0.4, -0.3);
            pSeatBack.yz *= rot(-0.2);
            dPanels = min(dPanels, sdBox(pSeatBack, vec3(0.25, 0.3, 0.02))); // Back

            res = opU(res, vec2(dPanels, 2.0)); // ID 2 = Sheet Metal

            // 4. TIRES & RIMS (ID: 3)
            float dTires = MAX_DIST;
            
            // Front Tire
            vec3 pTireF = p - vec3(0.95, 0.0, 1.6);
            pTireF.xy *= rot(1.5708);
            dTires = min(dTires, sdTorus(pTireF, vec2(0.3, 0.12)));
            dTires = min(dTires, sdCylinder(pTireF, 0.15, 0.22)); // Rim block

            // Rear Tire
            vec3 pTireR = p - vec3(0.95, 0.0, -1.6);
            pTireR.xy *= rot(1.5708);
            dTires = min(dTires, sdTorus(pTireR, vec2(0.3, 0.14))); // Slightly wider rear
            dTires = min(dTires, sdCylinder(pTireR, 0.15, 0.22));

            res = opU(res, vec2(dTires, 3.0)); // ID 3 = Rubber

            // 5. MOTOR & POWERTRAIN (ID: 4)
            float dMotor = MAX_DIST;
            
            // Solid Rear Axle Tube
            vec3 pAxle = p - vec3(0.0, 0.0, -1.6);
            pAxle.xy *= rot(1.5708);
            dMotor = min(dMotor, sdCylinder(pAxle, 0.9, 0.05));
            
            // Diff Pumpkin
            dMotor = min(dMotor, length(p - vec3(0.0, 0.0, -1.6)) - 0.15);
            
            // Electric Motor Block
            dMotor = min(dMotor, sdBox(p - vec3(0.0, 0.3, -1.2), vec3(0.18, 0.18, 0.25)));
            
            // Motor Cylinder Head/Stator
            vec3 pStator = p - vec3(0.0, 0.3, -0.8);
            pStator.xz *= rot(1.5708);
            dMotor = min(dMotor, sdCylinder(pStator, 0.15, 0.18));

            // Steering Wheel
            vec3 pWheel = p - vec3(0.2, 0.7, 0.3); // Offset to driver side
            pWheel.yz *= rot(-0.4);
            dMotor = min(dMotor, sdTorus(pWheel, vec2(0.15, 0.02)));
            dMotor = min(dMotor, sdCylinder(pWheel, 0.05, 0.02)); // Column center

            res = opU(res, vec2(dMotor, 4.0)); // ID 4 = Dark Mechanics

            return res;
        }

        // --- NORMAL CALCULATION ---
        vec3 calcNormal(vec3 p) {
            vec2 e = vec2(0.001, 0.0);
            return normalize(vec3(
                map(p + e.xyy).x - map(p - e.xyy).x,
                map(p + e.yxy).x - map(p - e.yxy).x,
                map(p + e.yyx).x - map(p - e.yyx).x
            ));
        }

        // --- AMBIENT OCCLUSION (The secret to SDF realism) ---
        float calcAO(vec3 p, vec3 n) {
            float occ = 0.0;
            float sca = 1.0;
            for(int i = 0; i < 5; i++) {
                float h = 0.01 + 0.12 * float(i) / 4.0;
                float d = map(p + h * n).x;
                occ += (h - d) * sca;
                sca *= 0.85;
                if(occ > 0.35) break;
            }
            return clamp(1.0 - 3.0 * occ, 0.0, 1.0);
        }

        // --- SOFT SHADOWS ---
        float calcSoftshadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
            float res = 1.0;
            float t = mint;
            for(int i = 0; i < 30; i++) {
                if(t > maxt) break;
                float h = map(ro + rd * t).x;
                if(h < 0.001) return 0.0;
                res = min(res, k * h / t);
                t += h;
            }
            return res;
        }

        // --- MAIN RENDER LOOP ---
        void main() {
            // Normalize pixel coordinates
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

            // Camera Setup
            vec3 ro = u_camPos;
            vec3 ta = u_camTarget;
            vec3 cw = normalize(ta - ro);
            vec3 cp = vec3(0.0, 1.0, 0.0);
            vec3 cu = normalize(cross(cw, cp));
            vec3 cv = normalize(cross(cu, cw));
            vec3 rd = normalize(uv.x * cu + uv.y * cv + 1.2 * cw); // 1.2 = FOV

            // Raymarching
            float t = 0.0;
            float matID = -1.0;
            for(int i = 0; i < MAX_STEPS; i++) {
                vec3 p = ro + rd * t;
                vec2 res = map(p);
                if(res.x < SURF_DIST) {
                    matID = res.y;
                    break;
                }
                if(t > MAX_DIST) break;
                t += res.x * 0.8; // 0.8 multiplier prevents overshooting thin frames
        }

        // Shading & Lighting
        vec3 col = vec3(0.01, 0.01, 0.012); // Dark Pitch Garage

        if(matID > -0.5) {
            vec3 p = ro + rd * t;
            vec3 n = calcNormal(p);
            vec3 r = reflect(rd, n);

            // Material Definitions
            vec3 albedo;
            float roughness = 0.5;
            
            if(matID == 0.0) { 
                // Concrete Floor & Walls
                albedo = vec3(0.15, 0.15, 0.16);
                // Concrete seams
                float grid = smoothstep(0.0, 0.05, abs(fract(p.x * 0.5) - 0.5)) * smoothstep(0.0, 0.05, abs(fract(p.z * 0.5) - 0.5));
                albedo -= grid * 0.05;
                roughness = 0.95;
            } 
            else if(matID == 1.0) { 
                    // Unistrut Frame (Galvanized Steel)
                    albedo = vec3(0.6, 0.65, 0.7); // Bluish grey metal
                    // Procedural Unistrut Slot visual trick (cheaper than geometry)
                    float slots = smoothstep(0.2, 0.4, sin(p.z * 60.0)) * smoothstep(0.2, 0.4, sin(p.y * 60.0));
                    albedo *= 0.5 + 0.5 * slots; 
                    roughness = 0.4;
                } 
                else if(matID == 2.0) { 
                    // Bare Sheet Metal Panels
                    albedo = vec3(0.75, 0.75, 0.75);
                    roughness = 0.3; // Shinier than strut
                } 
                else if(matID == 3.0) { 
                    // Tires
                    albedo = vec3(0.05);
                    roughness = 0.9;
                } 
                else if(matID == 4.0) { 
                // Motor / Mechanics
                albedo = vec3(0.2, 0.2, 0.25);
                roughness = 0.6;
            }
            else if(matID == 5.0) {
                // Neon Emissive Tubes
                albedo = vec3(3.0, 3.5, 4.0); // Blinding white-blue
                roughness = 1.0;
            }

            // Lighting (Garage Point Light + Ambient)
            vec3 lightPos = vec3(0.0, 8.0, 0.0);
            vec3 lig = normalize(lightPos - p);
            float lightDist = length(lightPos - p);
            float attenuation = 1.0 / (1.0 + 0.015 * lightDist * lightDist);

            vec3 hal = normalize(lig - rd);
            
            float dif = clamp(dot(n, lig), 0.0, 1.0) * attenuation;
            float sha = calcSoftshadow(p + n * 0.01, lig, 0.05, 12.0, 14.0);
            float ao = calcAO(p, n);
            
            // Ambient / Sky light
            float amb = clamp(0.3 + 0.7 * n.y, 0.0, 1.0);
            float bou = clamp(-dot(n, lig), 0.0, 1.0);

            // Combine lights
            vec3 lin = vec3(0.0);
            lin += 3.0 * dif * vec3(1.0, 0.95, 0.9) * sha; // Main shop light
            lin += 0.2 * amb * vec3(0.5, 0.6, 0.8) * ao; // Ambient fill
            lin += 0.1 * bou * vec3(0.8, 0.8, 0.8) * ao; // Ground bounce

            col = albedo * lin;

            // Specular highlight
            float spe = pow(clamp(dot(n, hal), 0.0, 1.0), 16.0) * dif * (1.0 - roughness);
            col += vec3(1.0) * spe * sha;
            
            // Force the neon lights to glow without shading
            if(matID == 5.0) col = albedo;
        }

        // Post Processing (Fog & Tonemapping)
        // Thick garage atmospheric dust falloff
        col = mix(col, vec3(0.01, 0.01, 0.012), 1.0 - exp(-0.015 * t * t)); 
        col = col / (1.0 + col); // Reinhard Tonemapping
        col = pow(col, vec3(0.4545)); // Gamma Correction

        gl_FragColor = vec4(col, 1.0);
    }
    </script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        let camPos = new THREE.Vector3(0, 1.6, 6); // Eye level, standing back
        let yaw = -Math.PI / 2; // Looking straight ahead (-Z)
        let pitch = -0.1; // Looking slightly down

        // Input States
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        document.body.addEventListener('mousedown', e => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            document.body.style.cursor = 'grabbing';
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.style.cursor = 'default';
        });
        
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            let dx = e.clientX - lastMouseX;
            let dy = e.clientY - lastMouseY;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            
            yaw -= dx * 0.005;
            pitch -= dy * 0.005;
            
            // Clamp pitch so you don't break your neck backwards
            pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_camPos: { value: new THREE.Vector3() },
            u_camTarget: { value: new THREE.Vector3() },
            u_time: { value: 0.0 }
        };

        const material = new THREE.ShaderMaterial({
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: uniforms,
            depthWrite: false,
            depthTest: false
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Resize handler
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            
            // Calculate Walk Directions based on Yaw
            let forward = new THREE.Vector3(Math.cos(yaw), 0, Math.sin(yaw)).normalize();
            let right = new THREE.Vector3(-Math.sin(yaw), 0, Math.cos(yaw)).normalize();
            let speed = 0.08; // Walking speed
            
            if (keys.w) camPos.addScaledVector(forward, speed);
            if (keys.s) camPos.addScaledVector(forward, -speed);
            if (keys.a) camPos.addScaledVector(right, -speed);
            if (keys.d) camPos.addScaledVector(right, speed);
            
            // Lock height to simulate walking on the concrete floor
            camPos.y = 1.6;

            // Calculate Look Target
            let lookDir = new THREE.Vector3(
                Math.cos(pitch) * Math.cos(yaw),
                Math.sin(pitch),
                Math.cos(pitch) * Math.sin(yaw)
            );
            let targetPos = camPos.clone().add(lookDir);
            
            // Feed data to the SDF Raymarcher
            uniforms.u_camPos.value.copy(camPos);
            uniforms.u_camTarget.value.copy(targetPos);
            uniforms.u_time.value = clock.getElapsedTime();
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
