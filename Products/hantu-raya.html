<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hantu Raya (Realism Mode)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Let clicks pass through to 3D canvas */
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
        }
        .header {
            border-left: 4px solid #fff;
            padding-left: 15px;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: normal;
            color: #aaa;
            letter-spacing: 1px;
        }

        .controls-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            text-align: right;
            font-size: 0.85rem;
            color: #666;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
        }
        .crosshair::before { top: 19px; left: -10px; width: 60px; height: 1px; }
        .crosshair::after { left: 19px; top: -10px; height: 60px; width: 1px; }
        
        /* Blueprint grid overlay styling */
        .blueprint-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        /* Legend UI panel styling */
        .legend-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #333;
            border-left: 4px solid #00ffcc;
            padding: 20px;
            font-size: 0.85rem;
            color: #ccc;
            z-index: 10;
            width: 240px;
            pointer-events: auto;
        }
        .legend-title {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #fff;
            border-bottom: 1px dashed #333;
            padding-bottom: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .legend-buttons {
            margin-top: 15px;
            border-top: 1px dashed #333;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .legend-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .legend-btn:hover {
            background: #00ffcc;
            color: #000;
            border-color: #00ffcc;
        }
    </style>
    <!-- Import Three.js, OrbitControls, and Details Map -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="details.js"></script>
</head>
<body>

    <div class="blueprint-overlay"></div>
    <div class="crosshair"></div>

    <div class="ui-layer">
        <div class="header">
            <h1>Project Hantu Raya</h1>
            <h2>Model 1 - Buggy Spaceframe (ORB-CF-001)</h2>
        </div>



        <div class="legend-panel">
            <div class="legend-title">System Legend</div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #00ffcc;"></div>
                <span>Chassis Spaceframe</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #222222; border: 1px solid #555;"></div>
                <span>700cc Engine Block</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ff3333;"></div>
                <span>Fuel Test Bottle & Lines</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #cccccc;"></div>
                <span>Suspension & Steering</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #111111; border: 1px solid #333;"></div>
                <span>Tires & Wheel Hubs</span>
            </div>
            
            <div class="legend-buttons">
                <button class="legend-btn" id="btn-labels">Toggle Tube Labels [L]</button>
                <button class="legend-btn" id="btn-ply">Toggle Point Cloud [P]</button>
            </div>
        </div>

        <div class="controls-hint">
            LEFT CLICK + DRAG TO ROTATE<br>
            SCROLL TO ZOOM<br>
            RIGHT CLICK TO PAN
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // ----------------------------------------------------
        // THREE.JS SCENE SETUP
        // ----------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Pure black background

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(-100, 80, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't allow going too far below ground

        // Add a technical grid on the floor (commented out to match the pure black background of the reference image)
        const gridHelper = new THREE.GridHelper(300, 60, 0x111122, 0x08080c);
        gridHelper.position.y = -20;
        // scene.add(gridHelper);

        // Group to hold all chassis parts
        const chassisGroup = new THREE.Group();
        scene.add(chassisGroup);

        // Group to hold all tube number labels
        const tubeLabelsGroup = new THREE.Group();
        chassisGroup.add(tubeLabelsGroup);
        let tubeCounter = 0;

        function createNumberSprite(number) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // Draw circular background
            ctx.beginPath();
            ctx.arc(32, 32, 28, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 255, 200, 0.85)';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Draw number text
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 32px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(number.toString(), 32, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(3, 3, 1);
            return sprite;
        }

        function addTubeLabel(x, y, z) {
            tubeCounter++;
            const sprite = createNumberSprite(tubeCounter);
            sprite.position.set(x, y, z);
            tubeLabelsGroup.add(sprite);
        }

        // Generate a procedural environment map to make chrome reflections gorgeous
        function createProceduralEnvMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0a0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, '#333344');
            grad.addColorStop(0.5, '#0a0a0d');
            grad.addColorStop(0.7, '#15151c');
            grad.addColorStop(1, '#22222b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 30;
            ctx.fillRect(40, 20, 120, 50);
            ctx.fillRect(300, 40, 100, 60);
            ctx.fillRect(180, 120, 80, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }
        scene.environment = createProceduralEnvMap();

        // Setup studio lighting for specular metallic highlights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);
        
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
        keyLight.position.set(100, 150, 50);
        scene.add(keyLight);
        
        const fillLight = new THREE.DirectionalLight(0x8899ff, 0.8);
        fillLight.position.set(-100, 100, -50);
        scene.add(fillLight);
        
        const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
        rimLight.position.set(0, 50, -150);
        scene.add(rimLight);
        
        const pointLight = new THREE.PointLight(0xffffff, 1.2, 120);
        pointLight.position.set(0, 15, 0);
        scene.add(pointLight);

        // ----------------------------------------------------
        // SHINY METALLIC MATERIALS
        // ----------------------------------------------------
        const chromeMaterial = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            metalness: 1.0,
            roughness: 0.12,
            name: 'chrome'
        });

        const tireMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            metalness: 0.1,
            roughness: 0.75,
            name: 'tire'
        });

        const rimMaterial = new THREE.MeshStandardMaterial({
            color: 0xdddddd,
            metalness: 0.95,
            roughness: 0.15,
            name: 'rim'
        });

        // Generate a metal diamond grating texture
        function createGratingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#222225';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#44444a';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(32, 0);
            ctx.lineTo(64, 32);
            ctx.lineTo(32, 64);
            ctx.lineTo(0, 32);
            ctx.closePath();
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(32, 32);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(64, 0);
            ctx.lineTo(32, 32);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 64);
            ctx.lineTo(32, 32);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(64, 64);
            ctx.lineTo(32, 32);
            ctx.stroke();
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 10);
            return texture;
        }

        const meshMaterial = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            metalness: 0.9,
            roughness: 0.3,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide,
            map: createGratingTexture(),
            name: 'mesh'
        });

        // ----------------------------------------------------
        // BUILDER FUNCTIONS
        // ----------------------------------------------------

        // Add a standard box tube based on exact center position and dimensions
        function addTubeCenter(w, h, d, x, y, z) {
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, chromeMaterial);
            mesh.position.set(x, y, z);
            mesh.userData = { type: 'frame', geomType: 'box' };
            chassisGroup.add(mesh);
            addTubeLabel(x, y, z); // Label this tube
            return mesh;
        }

        // Add a tube stretching from Point 1 to Point 2 (Point-to-Point)
        function addTubeP2P(x1, y1, z1, x2, y2, z2, width, height) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const dz = z2 - z1;
            const length = Math.hypot(Math.hypot(dx, dz), dy);
            
            const isBox = (width === rectW && height === rectH) || (width === 2.0 && height === 4.0);
            
            let geom;
            if (isBox) {
                geom = new THREE.BoxGeometry(width, height, length + 0.1);
            } else {
                const radius = width / 2;
                geom = new THREE.CylinderGeometry(radius, radius, length, 8);
            }
            
            const mesh = new THREE.Mesh(geom, chromeMaterial);
            mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
            
            const direction = new THREE.Vector3(dx, dy, dz).normalize();
            if (isBox) {
                mesh.lookAt(x2, y2, z2);
            } else {
                const alignAxis = new THREE.Vector3(0, 1, 0); // Cylinder standard Y direction
                mesh.quaternion.setFromUnitVectors(alignAxis, direction);
            }
            
            mesh.userData = { 
                type: isBox ? 'frame' : 'cage',
                geomType: isBox ? 'box' : 'cylinder'
            };
            chassisGroup.add(mesh);
            addTubeLabel((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2); // Label this tube
            return mesh;
        }

        // Add a curved continuous tube from an array of Vector3 points (matching realistic bends)
        function addCurveTube(points, radius, type = 'cage') {
            const curve = new THREE.CatmullRomCurve3(points);
            const geom = new THREE.TubeGeometry(curve, 64, radius, 12, false);
            const mesh = new THREE.Mesh(geom, chromeMaterial);
            mesh.userData = { type: type, geomType: 'tube' };
            chassisGroup.add(mesh);
            const midPoint = curve.getPointAt(0.5);
            addTubeLabel(midPoint.x, midPoint.y, midPoint.z); // Label this tube
            return mesh;
        }

        // Add crossmembers across the X axis
        function addCrossmember(x1, x2, y, z, height, depth) {
            const length = Math.abs(x2 - x1);
            const cx = (x1 + x2) / 2;
            return addTubeCenter(length, height, depth, cx, y, z);
        }

        // Add a body panel with chrome style
        function addBodyPanel(w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) {
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, chromeMaterial);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.userData = { type: 'frame', geomType: 'box' };
            chassisGroup.add(mesh);
            return mesh;
        }

        // ----------------------------------------------------
        // CONSTRUCTING THE CHASSIS: HANTU RAYA MODEL 1
        // ----------------------------------------------------
        
        // ----------------------------------------------------
        // CONSTRUCTING THE SPACEFRAME CHASSIS: ORB-CF-001
        // ----------------------------------------------------
        
        const rectW = 2.0;
        const rectH = 4.0;
        const mainW = 1.8;
        const mainH = 1.8;
        const secW = 1.2;
        const secH = 1.2;

        // --- BUGGY CHASSIS NODE COORDINATES ---

        // Lower Frame / Floor (Sill rails)
        const fL_front = {x: -12, y: 2, z: -60}; // Front firewall sill
        const fR_front = {x: 12,  y: 2, z: -60};
        const fL_mid   = {x: -21, y: 2, z: -40}; // Center belly sill
        const fR_mid   = {x: 21,  y: 2, z: -40};
        const fL_rear  = {x: -21, y: 2, z: -10}; // B-pillar sill base
        const fR_rear  = {x: 21,  y: 2, z: -10};

        // Tail / Rear Frame
        const tL_mid   = {x: -15, y: 18, z: 30};  // Mid-tail kicker
        const tR_mid   = {x: 15,  y: 18, z: 30};
        const tL_end   = {x: -8,  y: 12, z: 75}; // Tail end bumper corners
        const tR_end   = {x: 8,   y: 12, z: 75};

        // Cab Upper Nodes (Main Cage)
        const cL_dash  = {x: -21, y: 24, z: -60}; // Dashboard corners
        const cR_dash  = {x: 21,  y: 24, z: -60};
        const cL_roofF = {x: -17, y: 46, z: -40}; // Roof front corners
        const cR_roofF = {x: 17,  y: 46, z: -40};
        const cL_roofR = {x: -17, y: 46, z: -10}; // Roof rear corners (B-pillar top)
        const cR_roofR = {x: 17,  y: 46, z: -10};

        // Nose / Front bumper Nodes
        const nL_front = {x: -10, y: 6,  z: -75}; // Front bumper corners (aligned with rect frame y=6)
        const nR_front = {x: 10,  y: 6,  z: -75};

        // Mid B-Pillar nodes
        const cL_midB = {x: -21, y: 24, z: -10};
        const cR_midB = {x: 21,  y: 24, z: -10};


        // --- 1. BASE RECTANGULAR SUBFRAME ---
        // Main bottom side sills
        addTubeP2P(fL_front.x, fL_front.y, fL_front.z, fL_mid.x, fL_mid.y, fL_mid.z, rectW, rectH);
        addTubeP2P(fR_front.x, fR_front.y, fR_front.z, fR_mid.x, fR_mid.y, fR_mid.z, rectW, rectH);
        addTubeP2P(fL_mid.x, fL_mid.y, fL_mid.z, fL_rear.x, fL_rear.y, fL_rear.z, rectW, rectH);
        addTubeP2P(fR_mid.x, fR_mid.y, fR_mid.z, fR_rear.x, fR_rear.y, fR_rear.z, rectW, rectH);
        
        // Tapered front nose rails
        addTubeP2P(fL_front.x, fL_front.y, fL_front.z, nL_front.x, nL_front.y, nL_front.z, rectW, rectH);
        addTubeP2P(fR_front.x, fR_front.y, fR_front.z, nR_front.x, nR_front.y, nR_front.z, rectW, rectH);

        // Subframe Crossmembers
        addTubeP2P(nL_front.x, nL_front.y, nL_front.z, nR_front.x, nR_front.y, nR_front.z, rectW, rectH); // Front bumper
        addTubeP2P(fL_front.x, fL_front.y, fL_front.z, fR_front.x, fR_front.y, fR_front.z, rectW, rectH); // Firewall
        addTubeP2P(fL_mid.x, fL_mid.y, fL_mid.z, fR_mid.x, fR_mid.y, fR_mid.z, rectW, rectH); // Mid-floor
        addTubeP2P(fL_rear.x, fL_rear.y, fL_rear.z, fR_rear.x, fR_rear.y, fR_rear.z, rectW, rectH); // B-pillar base


        // --- 2. CAB MAIN HOOP & ROOF (B-PILLAR) ---
        // Beautiful continuous curved main roll bar hoop
        addCurveTube([
            new THREE.Vector3(fL_rear.x, fL_rear.y + 1, fL_rear.z),
            new THREE.Vector3(fL_rear.x + 0.3, fL_rear.y + 15, fL_rear.z),
            new THREE.Vector3(cL_roofR.x - 1.5, cL_roofR.y - 2, cL_roofR.z),
            new THREE.Vector3(cL_roofR.x + 2, cL_roofR.y, cL_roofR.z),
            new THREE.Vector3(cR_roofR.x - 2, cR_roofR.y, cR_roofR.z),
            new THREE.Vector3(cR_roofR.x + 1.5, cR_roofR.y - 2, cR_roofR.z),
            new THREE.Vector3(fR_rear.x - 0.3, fR_rear.y + 15, fR_rear.z),
            new THREE.Vector3(fR_rear.x, fR_rear.y + 1, fR_rear.z)
        ], mainW / 2, 'cage');

        addTubeP2P(cL_midB.x, cL_midB.y, cL_midB.z, cR_midB.x, cR_midB.y, cR_midB.z, mainW, mainH); // Mid B-Pillar cross

        // Roof rails & A-pillars integrated into smooth curved tubes on each side
        addCurveTube([
            new THREE.Vector3(cL_roofR.x, cL_roofR.y, cL_roofR.z),
            new THREE.Vector3(cL_roofF.x, cL_roofF.y, cL_roofF.z + 2),
            new THREE.Vector3(cL_roofF.x - 0.5, cL_roofF.y - 1, cL_roofF.z - 2),
            new THREE.Vector3(cL_dash.x, cL_dash.y, cL_dash.z)
        ], mainW / 2, 'cage');

        addCurveTube([
            new THREE.Vector3(cR_roofR.x, cR_roofR.y, cR_roofR.z),
            new THREE.Vector3(cR_roofF.x, cR_roofF.y, cR_roofF.z + 2),
            new THREE.Vector3(cR_roofF.x + 0.5, cR_roofF.y - 1, cR_roofF.z - 2),
            new THREE.Vector3(cR_dash.x, cR_dash.y, cR_dash.z)
        ], mainW / 2, 'cage');

        // Front roof crossmember
        addTubeP2P(cL_roofF.x, cL_roofF.y, cL_roofF.z, cR_roofF.x, cR_roofF.y, cR_roofF.z, mainW, mainH);


        // --- 3. WINDSHIELD, DASH & NOSE CAGE ---
        addTubeP2P(cL_dash.x, cL_dash.y, cL_dash.z, cR_dash.x, cR_dash.y, cR_dash.z, mainW, mainH); // Dash cross

        // Front nose tubes (round upper rails)
        addTubeP2P(cL_dash.x, cL_dash.y, cL_dash.z, nL_front.x, nL_front.y + 1, nL_front.z, mainW, mainH);
        addTubeP2P(cR_dash.x, cR_dash.y, cR_dash.z, nR_front.x, nR_front.y + 1, nR_front.z, mainW, mainH);


        // --- 4. REAR TAPERED BUGGY BED (TAIL FRAME) ---
        // Beautiful continuous curved outer loops for the left and right bed sides
        addCurveTube([
            new THREE.Vector3(cL_midB.x, cL_midB.y, cL_midB.z),
            new THREE.Vector3(-20.5, 20, 25),
            new THREE.Vector3(-18, 16, 60),
            new THREE.Vector3(-18, 10, 60),
            new THREE.Vector3(-20.5, 6, 25),
            new THREE.Vector3(fL_rear.x, fL_rear.y + 1, fL_rear.z)
        ], mainW / 2, 'cage');

        addCurveTube([
            new THREE.Vector3(cR_midB.x, cR_midB.y, cR_midB.z),
            new THREE.Vector3(20.5, 20, 25),
            new THREE.Vector3(18, 16, 60),

                const alignGroup = new THREE.Group();
                alignGroup.position.copy(start);

                const up = new THREE.Vector3(0, 1, 0);
                if (Math.abs(dir.dot(up)) < 0.999) {
                    const axis = new THREE.Vector3().crossVectors(up, dir).normalize();
                    const angle = Math.acos(up.dot(dir));
                    alignGroup.quaternion.setFromAxisAngle(axis, angle);
                } else {
                    if (dir.y < 0) alignGroup.scale.y = -1;
                }

                // Mount brackets at start (frame)
                const mountGeom = new THREE.BoxGeometry(0.8, 1.2, 1.8);
                const mountMesh = new THREE.Mesh(mountGeom, chromeMaterial);
                mountMesh.position.set(0, 0.5, 0);
                alignGroup.add(mountMesh);

                // Shock body (lower half of assembly)
                const bodyLen = len * 0.45;
                const bodyGeom = new THREE.CylinderGeometry(1.1, 1.1, bodyLen, 16);
                const bodyMesh = new THREE.Mesh(bodyGeom, chromeMaterial);
                bodyMesh.position.y = bodyLen / 2 + 1.0;
                alignGroup.add(bodyMesh);

                // Shock shaft (upper half)
                const shaftLen = len - bodyLen - 2.0;
                const shaftGeom = new THREE.CylinderGeometry(0.4, 0.4, shaftLen, 8);
                const shaftMesh = new THREE.Mesh(shaftGeom, chromeMaterial);
                shaftMesh.position.y = bodyLen + 1.0 + shaftLen / 2;
                alignGroup.add(shaftMesh);

                // Shock "Bell" (shroud cup at the top of the body/shaft connection)
                const bellGeom = new THREE.CylinderGeometry(1.6, 1.3, 1.8, 16);
                const bellMesh = new THREE.Mesh(bellGeom, chromeMaterial);
                bellMesh.position.y = bodyLen + 1.0;
                alignGroup.add(bellMesh);

                // Mount brackets at end (control arm / axle)
                const endMountGeom = new THREE.BoxGeometry(0.8, 1.2, 1.8);
                const endMountMesh = new THREE.Mesh(endMountGeom, chromeMaterial);
                endMountMesh.position.set(0, len - 0.5, 0);
                alignGroup.add(endMountMesh);

                // Optional Helical Coil Spring (for coilovers)
                if (hasSpring) {
                    const springRadius = 1.4;
                    const springTurns = 8;
                    const springStart = 1.5;
                    const springEnd = len - 1.5;
                    const points = [];
                    for (let i = 0; i <= 100; i++) {
                        const t = i / 100;
                        const angle = t * Math.PI * 2 * springTurns;
                        const y = springStart + t * (springEnd - springStart);
                        const x = Math.cos(angle) * springRadius;
                        const z = Math.sin(angle) * springRadius;
                        points.push(new THREE.Vector3(x, y, z));
                    }
                    const springCurve = new THREE.CatmullRomCurve3(points);
                    const springGeom = new THREE.TubeGeometry(springCurve, 100, 0.25, 8, false);
                    const springMesh = new THREE.Mesh(springGeom, chromeMaterial);
                    alignGroup.add(springMesh);
                }

                chassisGroup.add(alignGroup);
            }

            // Shock Towers (mount hoops on the front frame)
            addTubeP2P(-12, 2, -60, -14, 20, -60, mainW, mainH);
            addTubeP2P(12, 2, -60, 14, 20, -60, mainW, mainH);

            // Left Front IFS (A-Arms & Spindles)
            addTubeP2P(-12, 2, -65, -24, -6, -60, secW, secH);
            addTubeP2P(-12, 2, -55, -24, -6, -60, secW, secH);
            addTubeP2P(-15, 10, -63, -22, 4, -60, secW, secH);
            addTubeP2P(-15, 10, -57, -22, 4, -60, secW, secH);
            addTubeP2P(-22, 4, -60, -24, -6, -60, 1.4, 1.4); // Knuckle
            addTubeP2P(-23, -1, -60, -27, -1, -60, 1.8, 1.8); // Spindle Stub
            createDetailedShock(-14, 18, -60, -20, -1, -60, true); // Detailed Coilover with Bell

            // Right Front IFS (A-Arms & Spindles)
            addTubeP2P(12, 2, -65, 24, -6, -60, secW, secH);
            addTubeP2P(12, 2, -55, 24, -6, -60, secW, secH);
            addTubeP2P(15, 10, -63, 22, 4, -60, secW, secH);
            addTubeP2P(15, 10, -57, 22, 4, -60, secW, secH);
            addTubeP2P(22, 4, -60, 24, -6, -60, 1.4, 1.4); // Knuckle
            addTubeP2P(23, -1, -60, 27, -1, -60, 1.8, 1.8); // Spindle Stub
            createDetailedShock(14, 18, -60, 20, -1, -60, true); // Detailed Coilover with Bell

            // Rear Solid Axle & Leaf Springs
            const axleY = -1;
            const axleZ = 45;
            
            // Diff Pumpkin
            const diffGeom = new THREE.SphereGeometry(3.5, 16, 16);
            const diffMesh = new THREE.Mesh(diffGeom, chromeMaterial);
            diffMesh.position.set(0, axleY, axleZ);
            chassisGroup.add(diffMesh);

            // Axle Housing & Hubs
            addTubeP2P(-24, axleY, axleZ, 24, axleY, axleZ, 2.5, 2.5);
            addTubeP2P(-24, axleY, axleZ, -27, axleY, axleZ, 2.8, 2.8);
            addTubeP2P(24, axleY, axleZ, 27, axleY, axleZ, 2.8, 2.8);

            // Left Leaf Spring Pack - 3 stacked leaves (Main, Second, Third)
            // Main Leaf
            addCurveTube([
                new THREE.Vector3(-21, 2, 20),
                new THREE.Vector3(-21.5, 0, 32),
                new THREE.Vector3(-22, axleY - 1.0, axleZ),
                new THREE.Vector3(-20.5, 0, 58),
                new THREE.Vector3(-18, 5, 65)
            ], 0.8, 'cage');
            // Second Leaf
            addCurveTube([
                new THREE.Vector3(-21.2, 1, 25),
                new THREE.Vector3(-21.7, -0.2, 34),
                new THREE.Vector3(-22, axleY - 1.2, axleZ),
                new THREE.Vector3(-20.7, -0.2, 54),
                new THREE.Vector3(-19.0, 3.5, 61)
            ], 0.7, 'cage');
            // Third Leaf
            addCurveTube([
                new THREE.Vector3(-21.6, 0.5, 32),
                new THREE.Vector3(-22, axleY - 1.4, axleZ),
                new THREE.Vector3(-20.9, 0.5, 52)
            ], 0.6, 'cage');
            // Left Shackle link
            addTubeP2P(-18, 5, 65, -18, 9, 65, 0.6, 0.6);
            // Left clamping block / U-bolt bracket
            const leftClampGeom = new THREE.BoxGeometry(1.8, 2.2, 1.8);
            const leftClampMesh = new THREE.Mesh(leftClampGeom, chromeMaterial);
            leftClampMesh.position.set(-22, axleY - 0.5, axleZ);
            chassisGroup.add(leftClampMesh);

            // Right Leaf Spring Pack - 3 stacked leaves (Main, Second, Third)
            // Main Leaf
            addCurveTube([
                new THREE.Vector3(21, 2, 20),
                new THREE.Vector3(21.5, 0, 32),
                new THREE.Vector3(22, axleY - 1.0, axleZ),
                new THREE.Vector3(20.5, 0, 58),
                new THREE.Vector3(18, 5, 65)
            ], 0.8, 'cage');
            // Second Leaf
            addCurveTube([
                new THREE.Vector3(21.2, 1, 25),
                new THREE.Vector3(21.7, -0.2, 34),
                new THREE.Vector3(22, axleY - 1.2, axleZ),
                new THREE.Vector3(20.7, -0.2, 54),
                new THREE.Vector3(19.0, 3.5, 61)
            ], 0.7, 'cage');
            // Third Leaf
            addCurveTube([
                new THREE.Vector3(21.6, 0.5, 32),
                new THREE.Vector3(22, axleY - 1.4, axleZ),
                new THREE.Vector3(20.9, 0.5, 52)
            ], 0.6, 'cage');
            // Right Shackle link
            addTubeP2P(18, 5, 65, 18, 9, 65, 0.6, 0.6);
            // Right clamping block / U-bolt bracket
            const rightClampMesh = leftClampMesh.clone();
            rightClampMesh.position.x = 22;
            chassisGroup.add(rightClampMesh);

            // Add 4 simple wheels/tires (matched rear wheel height to front at y = -1)
            addChassisWheel(-27, -1, -60, 11, 5.5);  // Front Left
            addChassisWheel(27, -1, -60, 11, 5.5);   // Front Right
            addChassisWheel(-27, -1, 45, 12, 6.0);   // Rear Left
            addChassisWheel(27, -1, 45, 12, 6.0);    // Rear Right
        }
        addSuspensionSystem();


        // ----------------------------------------------------
        // ANIMATION & RESIZE LOGIC
        // ----------------------------------------------------

        // Center the chassis group
        chassisGroup.position.z = -5; // slight visual offset to center it over the grid

        // --- 13. INVISIBLE PLY COORDINATES CLOUD ---
        let pointsCloud = null;
        fetch('hantu_raya_bounds.ply')
            .then(res => res.text())
            .then(text => {
                const lines = text.split('\n');
                const points = [];
                let readingVertices = false;
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed === 'end_header') {
                        readingVertices = true;
                        continue;
                    }
                    if (readingVertices && trimmed !== '') {
                        const parts = trimmed.split(/\s+/);
                        if (parts.length >= 3) {
                            points.push(new THREE.Vector3(
                                parseFloat(parts[0]),
                                parseFloat(parts[1]),
                                parseFloat(parts[2])
                            ));
                        }
                    }
                }
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.PointsMaterial({
                    color: 0x00ffcc,
                    size: 0.8,
                    transparent: true,
                    opacity: 0.2,
                    visible: false // Invisible by default
                });
                pointsCloud = new THREE.Points(geom, mat);
                chassisGroup.add(pointsCloud);
                console.log("PLY Coordinate cloud loaded. Press 'P' to toggle visibility.");
            })
            .catch(err => console.error("Error loading hantu_raya_bounds.ply:", err));

        // Toggle functions for labels and point cloud
        function toggleLabels() {
            tubeLabelsGroup.visible = !tubeLabelsGroup.visible;
            console.log(`Tube labels visibility: ${tubeLabelsGroup.visible}`);
        }

        function togglePointCloud() {
            if (pointsCloud) {
                pointsCloud.material.visible = !pointsCloud.material.visible;
                console.log(`PLY Coordinate cloud visibility: ${pointsCloud.material.visible}`);
            }
        }

        // Keydown handlers
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'p') {
                togglePointCloud();
            }
            if (e.key.toLowerCase() === 'l') {
                toggleLabels();
            }
        });

        // UI click handlers
        document.getElementById('btn-labels').addEventListener('click', toggleLabels);
        document.getElementById('btn-ply').addEventListener('click', togglePointCloud);

        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // required if controls.enableDamping or controls.autoRotate are set
            renderer.render(scene, camera);
        }

        // Start animation loop
        animate();

    </script>
</body>
</html>
